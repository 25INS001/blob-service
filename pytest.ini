[pytest]
# tests/contract  hermetic. In-process Flask test client, SQLite in memory,
#                 auth-service and S3 replaced by fakes. No network at all.
# tests/live      black-box HTTP against a running blob-service. Skipped
#                 unless --live is passed.
# tests/*.py      the pre-existing hermetic tests, left where they were.
#
#   pytest                # everything hermetic — the CI default
#   pytest --live         # adds the live layer
#   pytest -m fuzz        # just the abuse cases
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    contract: hermetic; in-process client, no network
    live: requires a running blob-service (enable with --live)
    fuzz: malformed, hostile or oversized input
    defect: encodes a known-broken behaviour; see DEVICE_PAT_MIGRATION.md

filterwarnings =
    ignore::DeprecationWarning
